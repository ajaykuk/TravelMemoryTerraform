
# ==========================================
# 3. Database Server Setup (MongoDB)
# ==========================================
- name: Configure MongoDB on Private Server
  hosts: db
  become: yes
  vars_files:
    - secrets.yml
  vars:
    mongo_admin_user: "admin"
    mongo_app_user: "mernuser"
    app_db_name: "merndatabase"

  tasks:
    - name: Add MongoDB Yum Repository (Amazon Linux 2023)
      copy:
        dest: /etc/yum.repos.d/mongodb-org-7.0.repo
        content: |
          [mongodb-org-7.0]
          name=MongoDB Repository
          baseurl=https://repo.mongodb.org/yum/amazon/2023/mongodb-org/7.0/x86_64/
          gpgcheck=1
          enabled=1
          gpgkey=https://www.mongodb.org/static/pgp/server-7.0.asc

    - name: Install MongoDB
      dnf:
        name: mongodb-org
        state: present

    - name: Ensure MongoDB bindIp is restricted to localhost and private IP
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^  bindIp:'
        line: '  bindIp: 127.0.0.1,{{ db_private_ip | default("10.0.2.188") }}'
      notify: Restart MongoDB

    - name: Start and enable MongoDB service
      become: yes
      systemd:
        name: mongod
        state: started
        enabled: yes

    - name: Check if MongoDB is already secured
      become: yes
      command: 'grep -q "authorization: enabled" /etc/mongod.conf'
      register: mongo_auth_check
      ignore_errors: yes
      changed_when: false

    - name: Create MongoDB Admin & Application Users
      shell: |
        mongosh "mongodb://127.0.0.1:27017/admin" --eval '
          db.createUser({
            user: "{{ mongo_admin_user }}",
            pwd: "{{ mongo_admin_pass }}",
            roles: [{ role: "root", db: "admin" }]
          });
          db.getSiblingDB("{{ app_db_name }}").createUser({
            user: "{{ mongo_app_user }}",
            pwd: "{{ mongo_app_pass }}",
            roles: [{ role: "readWrite", db: "{{ app_db_name }}" }]
          });
        '
      register: user_creation
      when: mongo_auth_check.rc != 0
      failed_when: user_creation.rc != 0 and 'already exists' not in user_creation.stderr

    - name: Ensure security block exists in mongod.conf
      become: yes
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^#?security:'
        line: 'security:'
        state: present
        
    - name: Ensure MongoDB authorization is enabled (Idempotent)
      become: yes
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^(\s*)authorization:'
        line: '  authorization: enabled'
        insertafter: '^security:'
      notify: Restart MongoDB
      
  handlers:
    - name: Restart MongoDB
      systemd:
        name: mongod
        state: restarted

# ==========================================
# 2 & 4. Web Server & Application Deployment
# ==========================================
- name: Deploy MERN Application
  hosts: web
  become: yes
  vars_files:
    - secrets.yml
  vars:
    repo_url: "https://github.com/ajaykuk/TravelMemoryTerraform.git"
    app_dir: "/var/www/mern-app"
    db_private_ip: "10.0.2.188"
    mongo_app_user: "mernuser"
    app_db_name: "merndatabase"

  tasks:
    - name: Install Node.js, NPM, Git, and Nginx
      dnf:
        name: 
          - nodejs
          - git
          - nginx
        state: present

    - name: Install PM2 globally for process management
      npm:
        name: pm2
        global: yes
        state: present

    - name: Ensure application directory exists with correct permissions
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user

    - name: Clone the MERN repository
      become_user: ec2-user
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: master
        force: yes

    - name: Configure Backend Environment Variables (.env)
      become_user: ec2-user
      copy:
        dest: "{{ app_dir }}/backend/.env"
        content: |
          PORT=3001
          NODE_ENV=production
          MONGO_URI=mongodb://{{ mongo_app_user }}:{{ mongo_app_pass }}@{{ db_private_ip }}:27017/{{ app_db_name }}?authSource={{ app_db_name }}

    - name: Install Backend Dependencies
      become_user: ec2-user
      npm:
        path: "{{ app_dir }}/backend"

    - name: Start Express Backend with PM2
      become_user: ec2-user
      shell: pm2 start index.js --name "mern-backend" || pm2 restart "mern-backend"
      args:
        chdir: "{{ app_dir }}/backend"

    - name: Configure Frontend Environment Variables (.env)
      become_user: ec2-user
      copy:
        dest: "{{ app_dir }}/frontend/.env"
        content: |
          REACT_APP_BACKEND_URL=https://travelmemory.live/api

    - name: Install Frontend Dependencies & Build React
      become_user: ec2-user
      shell: |
        npm install
        npm run build
      args:
        chdir: "{{ app_dir }}/frontend"

    - name: Configure Nginx to serve React and proxy Express
      copy:
        dest: /etc/nginx/conf.d/mern.conf
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              listen 443 ssl default_server;
              listen [::]:443 ssl default_server;
              server_name 107.23.187.128 travelmemory.live www.travelmemory.live;
              # server_name travelmemory.live www.travelmemory.live;
              # SSL Certificate paths (update with your actual paths or generated cert files)
                ssl_certificate /etc/letsencrypt/live/107.23.187.128/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/107.23.187.128/privkey.pem;
              # Allow Let's Encrypt validation requests
              location /.well-known/acme-challenge/ {
              root {{ app_dir }}/frontend/build;
              }

              # Serve React static build files
              location / {
                  root {{ app_dir }}/frontend/build;
                  index index.html index.htm;
                  try_files $uri $uri/ /index.html;
              }

              # Reverse proxy API requests to Express backend running on 3001
              location /api/ {
                  proxy_pass http://localhost:3001/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }

    - name: Remove default Nginx config and restart
      become: yes
      file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Restart Nginx

    - name: Ensure Nginx is enabled and running
      become: yes
      systemd:
        name: nginx
        state: started
        enabled: yes
